name: NPTEL Portal CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Validate Catalog, Test Backend & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Step 1 - Course catalog schema validation
        run: node .agents/skills/nptel-course-ingestor/scripts/validate-course.mjs backend/src/data/courses.json

      - name: Step 2 - Backend install & unit/integration test suite
        run: npm --prefix backend ci && npm --prefix backend test

      - name: Step 3 - Frontend install & production TypeScript + Vite build
        run: npm --prefix frontend ci && npm --prefix frontend run build
